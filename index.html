const VERIFIED='2026-11-11 15:36';
const CAT_ORDER=['游戏','生活','创作','音乐','科技','运动','资讯'];
const cats=['全部',...CAT_ORDER.filter(c=>items.some(x=>x.cat===c))];
const PLAT_ORDER=['YouTube','Twitch','Kick','CHZZK'];
const plats=['全部',...PLAT_ORDER.filter(p=>items.some(x=>x.plat===p))];
const SOON=[{n:'TikTok',why:'TikTok 没有公开的在播列表接口，无法在不登录的前提下逐条核查真人直播'},
            {n:'Facebook',why:'Facebook 直播需要登录才能浏览，没有公开的在播列表接口，因此无法接入'}];
function svgFallback(label,bg){return "data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='640' height='360'><rect width='640' height='360' fill='"+bg+"'/><text x='320' y='172' font-family='sans-serif' font-size='34' fill='rgba(255,255,255,.22)' text-anchor='middle'>\u2733</text><text x='320' y='208' font-family='sans-serif' font-size='14' letter-spacing='4' fill='rgba(255,255,255,.46)' text-anchor='middle'>"+String(label).toUpperCase()+"</text></svg>").replace(/'/g,'%27')}
const FALLBACK={Twitch:svgFallback('Twitch','#1a1c1b'),YouTube:svgFallback('YouTube','#c33b62'),Kick:svgFallback('Kick','#0e2f23'),CHZZK:svgFallback('CHZZK','#12222b')};
const verifiedTs=new Date(VERIFIED.replace(' ','T')+'+08:00').getTime();
// 刷新周期 6h，阈值 7h：排程正常时整轮保持「直播中」，只有脱班才降级为「核查时在播」
const stale=Date.now()-verifiedTs>7*3600*1000;
let cat='全部',plat='全部',limit=24;
const grid=document.querySelector('#grid');
const moreBtn=document.querySelector('#more');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const revealed=new Set();
document.querySelector('#verifiedAt').textContent=VERIFIED;
document.querySelector('#totalCount').textContent=items.length;

function fmt(n){return n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+' 万观看':n.toLocaleString('en-US')+' 人观看'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* 入场：卡片首次进入视口时按水平顺序错峰浮现，一生只演一次 */
let io=null,ioFired=false;
if('IntersectionObserver' in window && !reduceMotion.matches){
  io=new IntersectionObserver(entries=>{
    ioFired=true;
    const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>{
      const ra=a.target.getBoundingClientRect(), rb=b.target.getBoundingClientRect();
      return Math.abs(ra.top-rb.top)>6 ? ra.top-rb.top : ra.left-rb.left;
    });
    vis.forEach((e,i)=>{
      const el=e.target, delay=Math.min(i,5)*55;
      io.unobserve(el);
      requestAnimationFrame(()=>{
        el.style.transitionDelay=delay+'ms';
        el.classList.add('in');
      });
      setTimeout(()=>{el.style.transitionDelay='';el.classList.add('ready')},delay+600);
    });
  },{rootMargin:'0px 0px -5% 0px',threshold:.05});
}
function settle(el){el.classList.add('instant','in','ready');el.style.transitionDelay='';setTimeout(()=>el.classList.remove('instant'),80);}
/* 兜底：若观察器始终未回调（无渲染帧的环境），立刻让所有卡片可见，宁可无动效也不白屏 */
setTimeout(()=>{if(!ioFired)grid.querySelectorAll('.card').forEach(settle)},900);

function reveal(){
  grid.querySelectorAll('.card').forEach(el=>{
    const key=el.getAttribute('href');
    if(revealed.has(key)||!io){revealed.add(key);settle(el);return;}
    revealed.add(key);io.observe(el);
  });
}

function renderChips(){
  document.querySelector('#categories').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join('');
  document.querySelectorAll('#categories .chip').forEach(b=>b.onclick=()=>{if(cat===b.dataset.cat)return;cat=b.dataset.cat;limit=24;revealed.clear();render()});
  document.querySelector('#platforms').innerHTML=plats.map(p=>`<button class="chip ${p===plat?'active':''}" data-plat="${p}" aria-pressed="${p===plat}">${p}</button>`).join('')
    +SOON.map(p=>`<span class="chip soon" title="${p.why}">${p.n} · 暂不支持</span>`).join('');
  document.querySelectorAll('#platforms .chip[data-plat]').forEach(b=>b.onclick=()=>{if(plat===b.dataset.plat)return;plat=b.dataset.plat;limit=24;revealed.clear();render()});
}

/* 全部视图下按分类轮转交错：让首屏立刻呈现类型广度，而非同类扎堆 */
function mixOrder(list){
  const by={};
  list.forEach(x=>{(by[x.cat]=by[x.cat]||[]).push(x)});
  Object.keys(by).forEach(k=>by[k].sort((a,b)=>(b.v||0)-(a.v||0)));
  const keys=CAT_ORDER.filter(c=>by[c]);
  const out=[];
  for(let i=0;;i++){
    let added=false;
    keys.forEach(k=>{if(by[k][i]){out.push(by[k][i]);added=true}});
    if(!added)break;
  }
  return out;
}

function render(){
  renderChips();
  const filtered=items.filter(x=>(cat==='全部'||x.cat===cat)&&(plat==='全部'||x.plat===plat));
  const list=(cat==='全部'&&plat==='全部')?mixOrder(filtered):filtered;
  document.querySelector('#count').textContent=`${filtered.length} 场直播`;
  grid.innerHTML=list.slice(0,limit).map(x=>{
    const zh=esc(x.zh),orig=esc(x.orig),ch=esc(x.ch);
    const fb=FALLBACK[x.plat]||FALLBACK.Twitch;
    // x.st：该平台本轮核查失败，这条沿用上一轮结果（平台级故障隔离回填），不能标成"直播中"
    const itemStale=x.st||stale;
    const badgeTitle=x.st?'该平台本轮核查未通过，此条沿用上一轮结果并已重新确认封面可用；点开若已收播，等下一轮更新即可':(stale?('本轮核查（'+VERIFIED.slice(11)+'）时该直播正在播出，可能已结束；点开若已收播，等下一轮更新即可'):'该直播正在播出');
    return `<a class="card" href="${x.url}" target="_blank" rel="noopener" aria-label="${zh}，${x.plat} 频道 ${ch}，在新窗口打开">
      <div class="cover">
        <img src="${x.thumb}" alt="${zh} 封面" loading="lazy" onload="this.classList.add('ld')" onerror="this.onerror=null;this.src='${fb}';this.classList.add('ld')">
        <span class="badge${itemStale?' stale':''}" title="${badgeTitle}"><span class="pulse"></span>${itemStale?'核查时在播':'直播中'}</span>
        <span class="pill">${x.plat}</span>
        <span class="play" aria-hidden="true">↗</span>
      </div>
      <div class="info">
        <div class="avatar" aria-hidden="true">${x.av?`<img src="${esc(x.av)}" alt="" loading="lazy" onerror="this.remove()">`:''}<span>${esc((x.ch||'?').slice(0,1).toUpperCase())}</span></div>
        <div class="details">
          <h3>${zh}</h3>
          <div class="orig">原标题：${orig}</div>
          <div class="meta">${ch} · ${x.plat}${x.lang?' · '+x.lang:''}</div>
          <div class="tags"><span class="tag">${x.cat}</span><span class="tag">${fmt(x.v)}</span></div>
          <span class="watch">前往观看 ↗</span>
        </div>
      </div>
    </a>`}).join('')
    ||`<div class="empty">暂时没有符合条件的直播，试试其他筛选。</div>`;
  moreBtn.hidden=limit>=list.length;
  if(!moreBtn.hidden)moreBtn.innerHTML=`加载更多 ${list.length-limit} 场 <span class="mk" aria-hidden="true">✳</span>`;
  reveal();
}
moreBtn.onclick=()=>{limit+=24;render()};

/* header 滚动后转为玻璃态 */
const hd=document.querySelector('header');
const onScroll=()=>hd.classList.toggle('up',window.scrollY>6);
addEventListener('scroll',onScroll,{passive:true});
onScroll();
render();
</script>
</body>
